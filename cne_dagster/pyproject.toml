[project]
name = "cne_dagster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dagster>=1.10.6",
    "dagster-cloud",
    "dagster-dbt>=0.26.6",
    "dbt-bigquery>=1.9.1",
    "dbt-core>=1.9.3",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver", 
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "cne_dagster.definitions"
code_location_name = "cne_dagster"